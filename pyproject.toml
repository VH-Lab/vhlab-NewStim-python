[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vhlab_newstim"
version = "0.0.1"
description = "Python library to read data files from vhlab-NewStim-matlab"
readme = "README.md"
authors = [
  { name = "VH Lab", email = "vhlab@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

# The MATLAB -> Python bridge contract files ship with the package: they are
# the record of where each function came from. See PORTING_INSTRUCTIONS.
[tool.setuptools.package-data]
"*" = ["*.yaml"]
