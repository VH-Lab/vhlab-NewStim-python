  - name: loadstim
    matlab_class: blinkingstim
    type: method
    status: not_applicable
    matlab_path: "Stimuli/@blinkingstim/loadstim.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Psychtoolbox. Part of the presentation path: it fills, checks or
      releases the displaystruct that NewStimDisplayProcs hands to
      Psychtoolbox - offscreen textures, colour-lookup-table animation, movie
      handles or sound buffers. Psychtoolbox exists only for MATLAB, so there
      is nothing to port this to. Nor does a reader ever meet its output:
      @stimulus/strip.m clears the displaystruct before saveobj writes a
      stims.mat, so what is on disk is always the unloaded object.

