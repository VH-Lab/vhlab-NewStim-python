# MATLAB -> Python bridge contract for the vhlab_newstim.stimuli package.
#
# Every module in this package must appear here, and every MATLAB function
# under `Stimuli` must appear here with a `status`. Nothing in this package is
# ported yet: the entries below are the survey, written before the first port
# so that each one can be updated in the commit that ports its function.
#
# See PORTING_INSTRUCTIONS for the convention and the status vocabulary.

project_metadata:
  bridge_version: "1.1"
  matlab_repository: "https://github.com/VH-Lab/vhlab-NewStim-matlab"
  matlab_package_path: "Stimuli"
  matlab_last_sync_hash: "0ae6822"
  python_package: "vhlab_newstim.stimuli"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"
  matlab_file_count: 232
  coverage: "0 of 232 MATLAB functions ported; 132 not_applicable, 100 not_yet_ported."
  notes: >
    Nineteen stimulus classes - @stimulus and its eighteen concrete children -
    plus three more under in_development and two custom draw procedures. The
    split within each class is the same everywhere and is unusually clean:
    getparameters is the read surface and all nineteen classes define one,
    while loadstim / unloadstim / isloaded / customdraw / animate are
    Psychtoolbox and cannot be ported at all. The per-class grid, frame and
    value accessors sit in between - numeric, portable, and what reverse-
    correlation analysis actually reads - and are marked not_yet_ported rather
    than not_applicable.

functions:
  - name: blank
    matlab_class: blank
    type: class
    status: not_yet_ported
    matlab_path: "Stimuli/@blank/blank.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Constructor for the blank class. A Python reader needs the data half of
      it - the object recovered from a stims.mat has to be represented as
      something - but only that half: the MATLAB constructor also registers
      the class with NewStimListAdd and, when handed 'graphical', opens a
      parameter dialog. Port it as a data class built from the struct
      scipy.io.loadmat hands back, not as a translation of the constructor's
      control flow.

  - name: getparameters
    matlab_class: blank
    type: method
    status: not_yet_ported
    matlab_path: "Stimuli/@blank/getparameters.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      The read surface. Returns the parameter struct that describes what was
      shown, which is the whole reason this repository exists:
      ndi.daq.metadatareader.NewStimStims calls getparameters(get(ss,i)) on
      every stimulus of a recovered stimscript. Port this before anything else
      in this class.

  - name: blinkingstim
    matlab_class: blinkingstim
    type: class
    status: not_yet_ported
    matlab_path: "Stimuli/@blinkingstim/blinkingstim.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Constructor for the blinkingstim class. A Python reader needs the data
      half of it - the object recovered from a stims.mat has to be represented
      as something - but only that half: the MATLAB constructor also registers
      the class with NewStimListAdd and, when handed 'graphical', opens a
      parameter dialog. Port it as a data class built from the struct
      scipy.io.loadmat hands back, not as a translation of the constructor's
      control flow.

  - name: duration
    matlab_class: blinkingstim
    type: method
    status: not_yet_ported
    matlab_path: "Stimuli/@blinkingstim/duration.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Estimated stimulus duration. Portable arithmetic, but note that the
      MATLAB implementations read StimWindowRefresh from StimWindowGlobals -
      the refresh rate of the rig's monitor, which is a display global and is
      not stored in the stims.mat. A Python duration therefore has to take the
      refresh rate as an argument rather than discover it; decide that once,
      here, when the first one is ported.

  - name: findtransitions
    matlab_class: blinkingstim
    type: method
    status: not_yet_ported
    matlab_path: "Stimuli/@blinkingstim/findtransitions.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Finds frames where a grid cell changed between given colours. This is
      what reverse-correlation and frame-by-frame analysis read back out of a
      stimulus, so it is squarely in the reading scope. Numeric and portable.
      Not yet ported - no Python caller yet.

