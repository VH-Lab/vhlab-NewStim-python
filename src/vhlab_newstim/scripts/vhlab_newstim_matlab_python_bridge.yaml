# MATLAB -> Python bridge contract for the vhlab_newstim.scripts package.
#
# Every module in this package must appear here, and every MATLAB function
# under `Scripts` must appear here with a `status`. Nothing in this package is
# ported yet: the entries below are the survey, written before the first port
# so that each one can be updated in the commit that ports its function.
#
# See PORTING_INSTRUCTIONS for the convention and the status vocabulary.

project_metadata:
  bridge_version: "1.1"
  matlab_repository: "https://github.com/VH-Lab/vhlab-NewStim-matlab"
  matlab_package_path: "Scripts"
  matlab_last_sync_hash: "0ae6822"
  python_package: "vhlab_newstim.scripts"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"
  matlab_file_count: 28
  coverage: "0 of 28 MATLAB functions ported; 2 deprecated_in_matlab, 14 not_applicable, 12 not_yet_ported."
  notes: >
    The stimscript object is the root of everything this repository reads: a
    stims.mat holds one, under the variable name saveScript, and every
    stimulus reached in analysis is reached through it. Four of its methods
    have a caller today - numStims, get, getparameters and getDisplayOrder -
    and those four are the smallest useful port. The Psychtoolbox half of the
    class is loadStimScript / unloadStimScript / isloaded, and the
    construction half is append, insert, remove, set, plus and
    setDisplayMethod; both are out of scope, per file, below.

functions:
  - name: getparameters
    matlab_class: periodicscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@periodicscript/getparameters.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Unlike @stimscript/getparameters this returns a real parameter struct,
      describing which parameter was varied and over what range. In scope: it
      is how a reader recovers the design of the experiment rather than only
      its stimuli.

  - name: getpsstiminds
    matlab_class: periodicscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@periodicscript/getpsstiminds.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Returns the stimulus indices matching given parameter values. This is
      analysis, and is the periodicscript equivalent of what vhlib.StimDecode
      callers do by hand. Portable; wanted once the reader exists.

  - name: periodicscript
    matlab_class: periodicscript
    type: class
    status: deprecated_in_matlab
    matlab_path: "Scripts/@periodicscript/old/periodicscript.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Superseded by Scripts/@periodicscript/periodicscript.m, and kept only in
      an 'old' folder. Do not port.

  - name: periodicscript2
    matlab_class: periodicscript
    type: method
    status: deprecated_in_matlab
    matlab_path: "Scripts/@periodicscript/old/periodicscript2.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Superseded by Scripts/@periodicscript/periodicscript.m, and kept only in
      an 'old' folder. Do not port.

  - name: periodicscript
    matlab_class: periodicscript
    type: class
    status: not_yet_ported
    matlab_path: "Scripts/@periodicscript/periodicscript.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Constructor for periodicscript, a stimscript subclass that generates a
      family of periodicstim stimuli varying one parameter. Data half in
      scope, as for stimscript; the 'graphical' branch is not.

  - name: plus
    matlab_class: periodicscript
    type: method
    status: not_applicable
    matlab_path: "Scripts/@periodicscript/plus.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Construction, not reading. Building stimuli or scripts in Python would
      produce objects that nothing can present and that cannot be written
      back: scipy.io.savemat cannot write an old-style MATLAB object, which is
      what a stims.mat holds. Out of scope for a reader.

  - name: verifyperiodicscript
    matlab_class: periodicscript
    type: method
    status: not_applicable
    matlab_path: "Scripts/@periodicscript/private/verifyperiodicscript.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Private parameter validation for the constructor. Construction is out of
      scope (see the constructor entry); reading does not re-validate what
      MATLAB already accepted when the stimulus was built.

  - name: append
    matlab_class: stimscript
    type: method
    status: not_applicable
    matlab_path: "Scripts/@stimscript/append.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Construction, not reading. Building stimuli or scripts in Python would
