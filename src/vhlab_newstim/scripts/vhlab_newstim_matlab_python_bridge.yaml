  - name: stimTime
    matlab_class: stimscript
    type: method
    status: not_applicable
    matlab_path: "Scripts/@stimscript/private/stimTime.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Private timing helper. Its entire body is guarded by
      strcmp(computer,'MAC2') - Macintosh System 7/9, the platform NewStim was
      first written for - and it returns 0 on every platform in use today. It
      is dead code on the MATLAB side, and what it would have computed needs
      StimWindowRefresh from StimWindowGlobals in any case. Nothing to port;
      if script timing is ever wanted in Python, take it from
      @stimscript/duration and an explicit refresh rate.

