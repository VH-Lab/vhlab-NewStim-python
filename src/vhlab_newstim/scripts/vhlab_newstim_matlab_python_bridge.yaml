  - name: stimscript
    matlab_class: stimscript
    type: class
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/stimscript.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Constructor for the stimscript class - the object a stims.mat's
      saveScript variable holds, and the entry point for everything else in
      this repository. Its data is three fields: Stims (a cell array of
      stimulus objects), displayOrder, and StimTimes. Note that MATLAB stores
      it as an old-style class, which scipy.io.loadmat surfaces as a MATLAB-
      object wrapper rather than a struct; the reader has to unwrap that. Test
      fixtures have to be real stims.mat files recorded from MATLAB and
      committed, because savemat cannot write one.

