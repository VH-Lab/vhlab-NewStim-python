  - name: duration
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/duration.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Estimated stimulus duration. Portable arithmetic, but note that the
      MATLAB implementations read StimWindowRefresh from StimWindowGlobals -
      the refresh rate of the rig's monitor, which is a display global and is
      not stored in the stims.mat. A Python duration therefore has to take the
      refresh rate as an argument rather than discover it; decide that once,
      here, when the first one is ported.

  - name: eq
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/eq.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Value comparison of two objects. Portable; a Python port would be
      __eq__. No caller needs it yet.

  - name: equalstims
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/equalstims.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Compares the stimulus lists of two stimscripts, ignoring display order.
      Portable; no caller needs it yet.

  - name: get
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/get.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      GET(S, INDEX) returns the stimulus at 1-based INDEX; GET(S) returns them
      all. One of the four functions with a caller today. Under the indexing
      policy the Python signature keeps the 1-based index, since it is a user-
      facing concept that appears in stimtimes.txt and in the display order.

  - name: getDisplayOrder
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/getDisplayOrder.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      The order in which the stimuli were shown, as 1-based indices into the
      stimulus list. One of the four functions with a caller today, and the
      field that ties a stims.mat to the rows of a stimtimes.txt.

  - name: getallparameters
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/getallparameters.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      getparameters over every stimulus in the script, returning a cell array.
      Ports to a list of dicts. Cheap once stimscript.get and the per-class
      getparameters exist.

  - name: getparameters
    matlab_class: stimscript
    type: method
    status: not_yet_ported
    matlab_path: "Scripts/@stimscript/getparameters.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      Returns empty - a stimscript has no parameters of its own, unlike its
      stimuli and unlike @periodicscript. Port it anyway so the polymorphic
      call is answerable, and record here that returning None is the correct
      behaviour rather than a stub.

