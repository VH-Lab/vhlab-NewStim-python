  - name: saveobj
    matlab_class: stimscript
    type: method
    status: not_applicable
    matlab_path: "Scripts/@stimscript/saveobj.m"
    matlab_last_sync_hash: "0ae6822"
    decision_log: >
      The save path. strip clears the displaystruct (the Psychtoolbox display
